<h1 mat-dialog-title>
  <ng-container *ngIf="!data.unit">Create unit</ng-container>
  <ng-container *ngIf="data.unit">Update unit</ng-container>
</h1>
<form [formGroup]="form" (submit)="submit()">
  <div mat-dialog-content class="content">
    <mat-form-field appearance="fill">
      <mat-label>Number</mat-label>
      <input matInput type="number" formControlName="number" [required]="true">
      <mat-error *ngIf="form.controls['number'].touched && form.controls['number'].invalid">
        <span *ngIf="form.controls['number'].errors!['required']">This field is mandatory</span>
        <span *ngIf="form.controls['number'].errors!['server']">{{ form.controls['number'].errors!['server'] }}</span>
      </mat-error>
    </mat-form-field>
    <mat-form-field appearance="fill">
      <mat-label>Share</mat-label>
      <input matInput type="number" formControlName="share" [required]="true">
      <mat-error *ngIf="form.controls['share'].touched && form.controls['share'].invalid">
        <span *ngIf="form.controls['share'].errors!['required']">This field is mandatory</span>
        <span *ngIf="form.controls['share'].errors!['server']">{{ form.controls['share'].errors!['server'] }}</span>
      </mat-error>
    </mat-form-field>
    <mat-form-field appearance="fill">
      <mat-label>Address</mat-label>
      <input matInput formControlName="address" [required]="true">
      <mat-error *ngIf="form.controls['address'].touched && form.controls['address'].invalid">
        <span *ngIf="form.controls['address'].errors!['required']">This field is mandatory</span>
        <span *ngIf="form.controls['address'].errors!['server']">{{ form.controls['address'].errors!['server'] }}</span>
      </mat-error>
    </mat-form-field>
  </div>
  <div mat-dialog-actions>
    <button mat-button color="secondary" type="button" (click)="cancel()">Cancel</button>
    <div class="spacer"></div>
    <button mat-button color="primary" type="submit" [disabled]="form.invalid || !form.touched">Submit</button>
  </div>
</form>
