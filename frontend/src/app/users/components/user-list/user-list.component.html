<h2>Utilisateurs</h2>

<app-crud-table
  tableLabel="Utilisateurs"
  createLabel="Ajouter un utilisateur"
  [columns]="columns"
  [dataSource]="datasource"
  [canCreate]="canCreate$"
  [canEdit]="canEdit.bind(this)"
  (edit)="edit($event)"
  [canDelete]="canDelete.bind(this)"
  (delete)="delete($event)"
>
  <ng-container matColumnDef="enabled">
    <td mat-cell *matCellDef="let row">
      <mat-checkbox
        aria-label="Accès actif"
        [checked]="row.columns.enabled.value"
        disabled
      ></mat-checkbox>
    </td>
  </ng-container>

  <ng-container matColumnDef="admin">
    <td mat-cell *matCellDef="let row">
      <mat-checkbox
        aria-label="Administrateur"
        [checked]="row.columns.admin.value"
        disabled
      ></mat-checkbox>
    </td>
  </ng-container>
</app-crud-table>
