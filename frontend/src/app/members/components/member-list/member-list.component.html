<h2>Members</h2>

<app-crud-table
  tableLabel="Membres"
  createLabel="Ajouter un membre"
  [columns]="columns"
  [rowLabel]="rowLabel"
  [dataSource]="datasource"
  [canCreate]="canCreate$"
  [canEdit]="canEdit.bind(this)"
  (edit)="edit($event)"
  [canDelete]="canDelete.bind(this)"
  (delete)="delete($event)"
></app-crud-table>
