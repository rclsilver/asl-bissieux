apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "asl-bissieux.fullname" . }}
  labels:
    {{- include "asl-bissieux.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "asl-bissieux.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "asl-bissieux.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "asl-bissieux.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default `latest` }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [ server ]
          env:
            {{- if .Values.mailingLists.existingSecret }}
            - name: CONFIGURATION_FROM
              value: filetree:/run/secrets/asl-configuration
            {{- end }}
            - name: APP_DB_DIALECT
              value: "postgresql"
            - name: APP_DB_HOST
              value: "{{ .Values.postgresql.hostname | default `asl-bissieux-postgresql` }}"
            - name: APP_DB_PORT
              value: "{{ .Values.postgresql.port | default `5432` }}"
            - name: APP_DB_USERNAME
              value: "{{ .Values.postgresql.user | default `asl-bissieux` }}"
            - name: APP_DB_BASE
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.postgresql.existingSecret }}"
                  key: database
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.postgresql.existingSecret }}"
                  key: password
            - name: APP_DB_TIME_ZONE
              value: "{{ .Values.postgresql.timezone | default `UTC` }}"
            - name: APP_AUTH_GOOGLE_CLIENT_ID
              value: "{{ .Values.auth.client_id }}"
            - name: APP_AUTH_PROVIDER
              value: {{ .Values.auth.provider | default "google" | quote }}
            {{- if eq (.Values.auth.provider | default "google") "oidc" }}
            - name: APP_AUTH_OIDC_ISSUER
              value: {{ required "auth.oidc.issuer is required for OIDC" .Values.auth.oidc.issuer | quote }}
            - name: APP_AUTH_OIDC_CLIENT_ID
              value: {{ required "auth.client_id is required for OIDC" .Values.auth.client_id | quote }}
            - name: APP_AUTH_OIDC_PUBLIC_URL
              value: {{ required "auth.oidc.publicURL is required for OIDC" .Values.auth.oidc.publicURL | quote }}
            - name: APP_AUTH_OIDC_LABEL
              value: {{ .Values.auth.oidc.label | quote }}
            - name: APP_AUTH_OIDC_SESSION_DURATION
              value: {{ .Values.auth.oidc.sessionDuration | quote }}
            {{- if .Values.auth.oidc.existingSecret }}
            - name: APP_AUTH_OIDC_CLIENT_SECRET_FILE
              value: /run/secrets/asl-oidc/client-secret
            {{- end }}
            {{- end }}
            - name: APP_SMTP_HOST
              value: "{{ .Values.smtp.host }}"
            - name: APP_SMTP_PORT
              value: "{{ .Values.smtp.port }}"
            - name: APP_SMTP_TLS
              value: "{{ .Values.smtp.tls }}"
            - name: APP_SMTP_USERNAME
              value: "{{ .Values.smtp.username }}"
            - name: APP_SMTP_PASSWORD
              value: "{{ .Values.smtp.password }}"
            - name: APP_SMTP_FROM_NAME
              value: "{{ .Values.smtp.from.name }}"
            - name: APP_SMTP_FROM_ADDRESS
              value: "{{ .Values.smtp.from.address }}"
            - name: APP_SMTP_REPLY_TO_NAME
              value: "{{ .Values.smtp.reply_to.name }}"
            - name: APP_SMTP_REPLY_TO_ADDRESS
              value: "{{ .Values.smtp.reply_to.address }}"
            - name: APP_SMTP_TRACKING_URL
              value: "{{ .Values.smtp.tracking_url }}"
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if or .Values.mailingLists.existingSecret (and (eq (.Values.auth.provider | default "google") "oidc") .Values.auth.oidc.existingSecret) }}
          volumeMounts:
            {{- if and (eq (.Values.auth.provider | default "google") "oidc") .Values.auth.oidc.existingSecret }}
            - name: oidc-client-secret
              mountPath: /run/secrets/asl-oidc
              readOnly: true
            {{- end }}
            {{- if .Values.mailingLists.existingSecret }}
            - name: mailing-lists-secret
              mountPath: /run/secrets/asl-configuration
              readOnly: true
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /api/mon/ping
              port: http
          readinessProbe:
            httpGet:
              path: /api/mon/ping
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.mailingLists.existingSecret (and (eq (.Values.auth.provider | default "google") "oidc") .Values.auth.oidc.existingSecret) }}
      volumes:
        {{- if and (eq (.Values.auth.provider | default "google") "oidc") .Values.auth.oidc.existingSecret }}
        - name: oidc-client-secret
          secret:
            secretName: {{ .Values.auth.oidc.existingSecret | quote }}
            defaultMode: 0444
            items:
              - key: {{ .Values.auth.oidc.secretKey | quote }}
                path: client-secret
        {{- end }}
        {{- if .Values.mailingLists.existingSecret }}
        - name: mailing-lists-secret
          secret:
            secretName: {{ .Values.mailingLists.existingSecret | quote }}
            defaultMode: 0444
            items:
              - key: {{ .Values.mailingLists.secretKey | quote }}
                path: asl-bissieux-ovh-mailing-lists
        {{- end }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
