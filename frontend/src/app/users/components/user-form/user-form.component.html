<h1 mat-dialog-title>
  <ng-container *ngIf="!data.user">Create user</ng-container>
  <ng-container *ngIf="data.user">Update user</ng-container>
</h1>
<form [formGroup]="form" (submit)="submit()">
  <div mat-dialog-content class="content">
    <mat-form-field appearance="fill">
      <mat-label>Username</mat-label>
      <input matInput formControlName="username" [required]="true">
      <mat-error *ngIf="form.controls['username'].touched && form.controls['username'].invalid">
        <span *ngIf="form.controls['username'].errors!['required']">This field is mandatory</span>
        <span *ngIf="form.controls['username'].errors!['server']">{{ form.controls['username'].errors!['server'] }}</span>
      </mat-error>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Actions</mat-label>
      <mat-select formControlName="actions" multiple>
        <mat-option *ngFor="let action of actions$ | async" [value]="action">{{ action }}</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-checkbox matInput formControlName="enabled">Enabled</mat-checkbox>
    <mat-checkbox matInput formControlName="admin">Administrator</mat-checkbox>
  </div>
  <div mat-dialog-actions>
    <button mat-button color="secondary" type="button" (click)="cancel()">Cancel</button>
    <div class="spacer"></div>
    <button mat-button color="primary" type="submit" [disabled]="(saving$ | async) || form.invalid || !form.touched">Submit</button>
  </div>
</form>
