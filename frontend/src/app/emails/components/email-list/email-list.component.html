@if (!(campaign$ | async)) {
  <h2>E-mails</h2>
}
@if (campaign$ | async; as campaign) {
  <h2>{{ campaign.title }}</h2>
}
<app-crud-table
  tableLabel="E-mails"
  [canSelect]="true"
  [columns]="columns"
  [dataSource]="emails$ | async"
  [canDelete]="canDelete.bind(this)"
  (delete)="delete($event)"
  [toolbarActions]="toolbarActions$ | async"
  [rowActions]="rowActions$ | async"
>
  <ng-container matColumnDef="state">
    <td mat-cell *matCellDef="let email">
      <span class="{{ email.columns.state.value | lowercase }}">{{
        stateLabel(email.columns.state.value)
      }}</span>
      @if (email.original.error) {
        <span
          class="fa fa-exclamation-circle error"
          [matTooltip]="email.original.error"
        ></span>
      }
    </td>
  </ng-container>

  <ng-container matColumnDef="message">
    <td mat-cell *matCellDef="let row">
      <button
        mat-icon-button
        (click)="show(row.original)"
        matTooltip="Display the message"
      >
        <mat-icon>preview</mat-icon>
      </button>
    </td>
  </ng-container>
</app-crud-table>
