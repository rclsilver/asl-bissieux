<svg
  class="collections-chart"
  viewBox="0 0 680 300"
  role="img"
  aria-labelledby="chart-title chart-description"
>
  <title id="chart-title">Cumul des encaissements nets en {{ year }}</title>
  <desc id="chart-description">
    Les montants détaillés des douze mois figurent dans le tableau suivant. Les
    remboursements et leurs contre-écritures sont inclus. La ligne pointillée
    représente l’appelé actuel, toutes dates.
  </desc>
  <line x1="40" x2="640" [attr.y1]="y(0)" [attr.y2]="y(0)" class="axis" />
  <line
    x1="40"
    x2="640"
    [attr.y1]="y(called)"
    [attr.y2]="y(called)"
    class="called"
  />
  <polyline [attr.points]="chartPoints" class="curve" />
  <text x="40" y="20">{{ axis(chartBounds.max) }}</text>
  <text x="40" y="277">Janvier</text>
  <text x="585" y="277">Décembre</text>
  <text x="40" [attr.y]="y(0) - 5">0 €</text>
</svg>
