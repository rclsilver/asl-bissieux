<h2>Users</h2>

<app-crud-table
  [columns]="columns"
  [dataSource]="datasource"
  [canCreate]="canCreate$"
  [canEdit]="canEdit.bind(this)"
  (edit)="edit($event)"
  [canDelete]="canDelete.bind(this)"
  (delete)="delete($event)"
>
  <ng-container matColumnDef="enabled">
    <td mat-cell *matCellDef="let row">
      <mat-checkbox [checked]="row.columns.enabled.value" disabled></mat-checkbox>
    </td>
  </ng-container>

  <ng-container matColumnDef="admin">
    <td mat-cell *matCellDef="let row">
      <mat-checkbox [checked]="row.columns.admin.value" disabled></mat-checkbox>
    </td>
  </ng-container>
</app-crud-table>
