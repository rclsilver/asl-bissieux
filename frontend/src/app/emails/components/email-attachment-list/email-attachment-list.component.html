<h1 mat-dialog-title>Pièces jointes</h1>
<div mat-dialog-content class="content">
  <app-crud-table
    tableLabel="Pièces jointes"
    createLabel="Ajouter une pièce jointe"
    [columns]="columns"
    [dataSource]="datasource"
    [canCreate]="canCreate$"
    [canDelete]="canDelete.bind(this)"
    (edit)="edit($event)"
    (delete)="delete($event)"
    [rowActions]="rowActions"
  >
    <ng-container matColumnDef="inline">
      <td mat-cell *matCellDef="let row">
        <mat-checkbox
          aria-label="Intégrée au message"
          [checked]="row.columns.inline.value"
          disabled
        ></mat-checkbox>
      </td>
    </ng-container>
  </app-crud-table>
</div>
<div mat-dialog-actions>
  <div class="spacer"></div>
  <button mat-button color="primary" type="button" (click)="close()">
    Fermer
  </button>
</div>
