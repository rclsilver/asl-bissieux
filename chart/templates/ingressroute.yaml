{{- if .Values.ingressroute.enabled -}}
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "asl-bissieux.fullname" . }}
spec:
  entryPoints:
    - websecure
  routes:
  {{- range .Values.ingressroute.hosts }}
  - match: Host(`{{ . }}`)
    kind: Rule
    services:
    - kind: Service
      name: {{ include "asl-bissieux.fullname" $ }}
      port: {{ $.Values.service.port }}
  {{- end }}
  tls:
    certResolver: letsencrypt
{{- end }}
