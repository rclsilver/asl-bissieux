<mat-toolbar>
  <mat-toolbar-row>


  <div class="spacer"></div>

  <ng-container *ngFor="let action of toolbarActions">
    <button
      *ngIf="!action.loading$ || !(action.loading$ | async)"
      mat-icon-button
      type="button"
      (click)="action.func()"
      [matTooltip]="action.tooltip"
    >
      <span class="fa fa-{{ action.icon }}"></span>
    </button>

    <mat-progress-spinner
      *ngIf="action.loading$ && (action.loading$ | async)"
      mode="indeterminate"
      diameter="20"
      [matTooltip]="action.loadingTooltip || ''"
    >
    </mat-progress-spinner>
  </ng-container>

  <app-search-input [columns]="filters$ | async"></app-search-input>

  <button
    mat-icon-button
    *ngIf="canRefresh"
    type="button"
    (click)="refresh()"
    [disabled]="loading$ | async"
    matTooltip="Refresh data"
  >
    <mat-icon>refresh</mat-icon>
  </button>

  <button
    mat-icon-button
    type="button"
    (click)="onEdit()"
    matTooltip="Create a new resource"
    [disabled]="!(canCreate$ | async)"
  >
    <mat-icon>add</mat-icon>
  </button>
</mat-toolbar-row>
</mat-toolbar>

<div class="table-container">
  <table
    mat-table
    matSort
    matSortDisableClear
    [class.invisible]="!(loaded$ | async)"
  >
    <!-- Allow to add custom column definitions -->
    <ng-content></ng-content>

    <!-- Generate model columns -->
    <ng-container *ngFor="let column of columnDefs$ | async">
      <ng-container [matColumnDef]="column.name">
        <ng-container *ngIf="column.canSort">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="{{ column.name }}">{{ column.label }}</th>
        </ng-container>
        <ng-container *ngIf="!column.canSort">
          <th mat-header-cell *matHeaderCellDef>{{ column.label }}</th>
        </ng-container>
        <td mat-cell *matCellDef="let row">
          <span *ngIf="!row['columns'][column.name].route">{{ row['columns'][column.name].display }}</span>
          <a *ngIf="row['columns'][column.name].route" [routerLink]="row['columns'][column.name].route">{{ row['columns'][column.name].display }}</a>
        </td>
      </ng-container>
    </ng-container>

    <!-- Action column definition -->
    <ng-container matColumnDef="_actions_">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <ng-container *ngIf="(showActions$ | async) || (rowActions && rowActions!.length)">
          <button mat-icon-button [matMenuTriggerFor]="menu">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu" xPosition="before">
            <button [disabled]="!(canEditRow(row.original) | async)" mat-menu-item (click)="onEdit(row.original)">
              <mat-icon>edit</mat-icon>
              <span>Edit</span>
            </button>
            <button [disabled]="!(canDeleteRow(row.original) | async)" mat-menu-item (click)="onDelete(row.original)">
              <mat-icon>delete</mat-icon>
              <span>Delete</span>
            </button>
            <ng-container *ngFor="let action of rowActions">
              <button
                *ngIf="action.show(row)"
                [disabled]="action.disabled(row.original)"
                mat-menu-item
                (click)="action.func(row.original)"
                [matTooltip]="action.tooltip"
              >
                <mat-icon>{{ action.icon }}</mat-icon>
                <span>{{ action.label }}</span>
              </button>
            </ng-container>
          </mat-menu>
        </ng-container>
      </td>
    </ng-container>

    <ng-container *ngIf="columns$ | async as columns">
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns" [class]="rowClass(row.original)"></tr>
      <tr *matNoDataRow>
        <td [attr.colspan]="columnsCount$ | async">
          <div class="no-result">
            <span *ngIf="!(error$ | async)">No result found</span>
            <span *ngIf="error$ | async as error" class="error">
              Error while loading data: {{ error!.message }} (HTTP
              {{ error!.origin.status }} {{ error!.origin.statusText }})
            </span>
          </div>
        </td>
      </tr>
    </ng-container>
  </table>

  <div
    *ngIf="(loaded$ | async) && (loading$ | async)"
    class="loading"
  >
    <mat-progress-spinner
      color="primary"
      mode="indeterminate"
    ></mat-progress-spinner>
  </div>
</div>

<div *ngIf="!(loaded$ | async)" class="loader">
  <p>Fetching data from server...</p>
  <mat-progress-spinner
    mode="indeterminate"
    diameter="32"
  ></mat-progress-spinner>
</div>
