<h1>Lots</h1>

<app-crud-table
  tableLabel="Lots"
  createLabel="Ajouter un lot"
  [columns]="columns"
  [dataSource]="datasource"
  [canCreate]="canCreate$"
  [canEdit]="canEdit.bind(this)"
  (edit)="edit($event)"
  [canDelete]="canDelete.bind(this)"
  (delete)="delete($event)"
>
  <div table-filters class="list-filters">
    <mat-form-field subscriptSizing="dynamic"
      ><mat-label>Informations à vérifier</mat-label
      ><mat-select
        [value]="quality"
        (selectionChange)="filterQuality($event.value)"
        ><mat-option value="">Tous les lots</mat-option
        ><mat-option value="no_member">Sans membre associé</mat-option
        ><mat-option value="invalid_shares"
          >Sans parts positives</mat-option
        ></mat-select
      ></mat-form-field
    >
  </div></app-crud-table
>
