<h1>Budgets</h1>

<app-crud-table
  tableLabel="Budgets"
  createLabel="Ajouter un budget"
  [columns]="columns"
  [dataSource]="datasource"
  [canCreate]="canCreate$"
  [canEdit]="canEdit.bind(this)"
  (edit)="edit($event)"
  [canDelete]="canDelete.bind(this)"
  (delete)="delete($event)"
  [rowActions]="rowActions$ | async"
>
  <ng-container matColumnDef="draft">
    <td mat-cell *matCellDef="let budget">
      <mat-checkbox
        aria-label="Budget en brouillon"
        [checked]="budget.columns.draft.value"
        disabled
      ></mat-checkbox>
    </td>
  </ng-container>
</app-crud-table>
