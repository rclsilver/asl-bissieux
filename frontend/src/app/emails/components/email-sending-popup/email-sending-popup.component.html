<h1 mat-dialog-title>
  <span *ngIf="sending$ | async">Envoi en cours — {{current$ | async}} / {{total$ | async}} terminés</span>
  <span *ngIf="!(sending$ | async)">
    Envoi terminé
  </span>
</h1>
<div mat-dialog-content class="content">
  <mat-progress-bar *ngIf="sending$ | async" mode="determinate" [value]="progress$ | async"></mat-progress-bar>
  <p>Envoyés : {{sent$ | async}} — Erreurs ou résultats à vérifier : {{errors$ | async}} — Restants : {{remaining$ | async}}</p>
</div>
<div mat-dialog-actions class="buttons">
  <button *ngIf="sending$ | async" mat-flat-button color="warn" type="button" (click)="abort()">Arrêter</button>
  <button *ngIf="!(sending$ | async)" mat-button color="primary" type="button" (click)="close()">Fermer</button>
</div>
